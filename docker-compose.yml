services:
  postgres:
    image: postgres:18-alpine
    container_name: servicedesk-postgres
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk
    ports:
      - "5432:5432"
    volumes:
      - servicedesk_postgres_data:/var/lib/postgresql

volumes:
  servicedesk_postgres_data: